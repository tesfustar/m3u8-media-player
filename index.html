<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Player</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <script>
    // Start connecting to the stream server and fetching its playlist right away,
    // in parallel with hls.js loading, instead of waiting for it.
    (function () {
      var params = new URLSearchParams(location.search);
      var src = params.get('url') || params.get('src') || params.get('m3u8');
      if (!src) return;
      try {
        var origin = new URL(src, location.href).origin;
        var pc = document.createElement('link');
        pc.rel = 'preconnect';
        pc.href = origin;
        pc.crossOrigin = 'anonymous';
        document.head.appendChild(pc);
        var pl = document.createElement('link');
        pl.rel = 'preload';
        pl.as = 'fetch';
        pl.href = src;
        pl.crossOrigin = 'anonymous';
        document.head.appendChild(pl);
      } catch (e) {}
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
      background: #000;
    }
    #unmute {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1;
      padding: 10px 14px;
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font: 600 15px/1 system-ui, -apple-system, sans-serif;
      cursor: pointer;
    }
    #unmute[hidden] { display: none; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline controls preload="auto"></video>
  <button id="unmute" type="button" hidden>🔇 Tap for sound</button>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script>
    (function () {
      var video = document.getElementById('video');
      var unmuteBtn = document.getElementById('unmute');
      var params = new URLSearchParams(location.search);
      var src = params.get('url') || params.get('src') || params.get('m3u8');

      if (!src) {
        console.warn('No stream given. Use ?url=<m3u8 link>');
        return;
      }

      // Always try to play with sound first. Browsers only allow that if the viewer has
      // interacted with this site before; otherwise play muted and unmute on first interaction.
      video.muted = false;
      function play() {
        var p = video.play();
        if (p && p.catch) {
          p.catch(function (err) {
            if (!err || err.name !== 'NotAllowedError') return;
            video.muted = true;
            unmuteBtn.hidden = false;
            video.play().catch(function () {});
          });
        }
      }

      video.addEventListener('volumechange', function () {
        if (!video.muted) unmuteBtn.hidden = true;
      });

      // Runs once only, so it doesn't fight the pause/mute controls afterwards.
      var events = ['pointerdown', 'touchend', 'keydown'];
      function onFirstInteract() {
        events.forEach(function (e) { document.removeEventListener(e, onFirstInteract, true); });
        if (!unmuteBtn.hidden) {
          video.muted = false;
          unmuteBtn.hidden = true;
          if (video.paused) play();
        }
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
          try {
            var r = req.call(el);
            if (r && r.catch) r.catch(function () {});
          } catch (e) {}
        }
      }
      events.forEach(function (e) { document.addEventListener(e, onFirstInteract, true); });

      if (window.Hls && Hls.isSupported()) {
        var hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.attachMedia(video);
        hls.loadSource(src);
        hls.on(Hls.Events.MANIFEST_PARSED, play);
        hls.on(Hls.Events.ERROR, function (_, data) {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setTimeout(function () { hls.startLoad(); }, 2000);
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else {
            console.error('Fatal HLS error', data);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari / iOS native HLS
        video.src = src;
        play();
      } else {
        console.error('HLS is not supported in this browser');
      }
    })();
  </script>
</body>
</html>
